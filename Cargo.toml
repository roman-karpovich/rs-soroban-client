[package]
name = "soroban-client"
version = "0.7.0"
edition = "2021"
rust-version = "1.87.0"
description = "A high-level library Rust client library for interacting with Soroban smart contracts on the Stellar blockchain"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/rahul-soshte/rs-soroban-client"
keywords = ["stellar", "soroban", "rust"]
authors = ["Rahul Soshte <rahul.soshte47@gmail.com>"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# Temporary until the companion stellar-baselib 0.7.0 release is published.
stellar-baselib = { version = "0.7.0", git = "https://github.com/roman-karpovich/rs-stellar-base", rev = "64241f8e1fb46d75adfa638fb5fc8f1e346ea9a8" }
tokio = { version = "1.43.0", features = ["time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.11.20", features = ["json"] }
futures = "0.3"
hex = "0.4"
tracing = "0.1.40"
thiserror = { version = "2.0.9" }

[dev-dependencies]
tokio = { version = "1.43.0", features = ["full", "macros"] }
base64 = "0.22.1"
wiremock = "0.6.2"

[features]
default = []
cap_0083 = ["stellar-baselib/cap_0083"]
